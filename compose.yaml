services:
  proxy:
    image: qmcgaw/gluetun:v3.41.3
    container_name: amnezia-proxy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${HTTP_PROXY_PORT:-3128}:8888/tcp"
      - "${SOCKS_PROXY_PORT:-1080}:1080/tcp"
    volumes:
      - ./config/amnezia.conf:/gluetun/amneziawg/awg0.conf:ro
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=amneziawg
      - TZ=${TZ:-UTC}
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE=${CONTROL_SERVER_AUTH_DEFAULT_ROLE:-{"auth":"none"}}
      - FIREWALL_OUTBOUND_SUBNETS=${FIREWALL_OUTBOUND_SUBNETS:-}
      - HEALTH_VPN_DURATION_INITIAL=${HEALTH_VPN_DURATION_INITIAL:-120s}
      - HEALTH_VPN_DURATION_ADDITION=${HEALTH_VPN_DURATION_ADDITION:-5s}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8000/v1/vpn/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  acl-proxy:
    build:
      context: ./proxy
    container_name: amnezia-acl-proxy
    restart: unless-stopped
    network_mode: service:proxy
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      - PROXY_USERNAME=${PROXY_USERNAME:-proxy}
      - PROXY_PASSWORD=${PROXY_PASSWORD:?Set PROXY_PASSWORD in .env}
      - PROXY_WHITELIST=${PROXY_WHITELIST:-}

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: amnezia-prometheus
    restart: unless-stopped
    depends_on:
      - proxy
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090/tcp"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

volumes:
  prometheus-data:
