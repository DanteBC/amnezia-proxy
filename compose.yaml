services:
  proxy:
    build:
      context: ./vpn
    container_name: amnezia-proxy
    restart: unless-stopped
    init: true
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${HTTP_PROXY_PORT:-3128}:8888/tcp"
      - "${SOCKS_PROXY_PORT:-1080}:1080/tcp"
    volumes:
      - ./config/amnezia3.conf:/etc/amnezia/awg0.conf:ro
    entrypoint: ["/usr/local/bin/amneziawg-entrypoint.sh"]
    environment:
      - TZ=${TZ:-UTC}
      - AMNEZIAWG_CONFIG=/etc/amnezia/awg0.conf
    healthcheck:
      test: ["CMD-SHELL", "ip link show awg0 >/dev/null && ip route get 1.1.1.1 >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  acl-proxy:
    build:
      context: ./proxy
    container_name: amnezia-acl-proxy
    restart: unless-stopped
    network_mode: service:proxy
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      - PROXY_USERNAME=${PROXY_USERNAME:-proxy}
      - PROXY_PASSWORD=${PROXY_PASSWORD:?Set PROXY_PASSWORD in .env}
      - PROXY_WHITELIST=${PROXY_WHITELIST:-}

